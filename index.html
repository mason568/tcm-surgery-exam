  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body,#root{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;-webkit-tap-highlight-color:transparent}
    .app-container{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative}
    ::-webkit-scrollbar{display:none}
    body{-webkit-overflow-scrolling:touch}
    .progress-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;height:4px;background:#e0e0e0;z-index:100}
    .progress-fill{height:100%;background:linear-gradient(90deg,#52c41a,#faad14,#f5222d);transition:width 0.3s ease}
    .card{background:#fff;border-radius:12px;padding:20px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
    .btn{display:block;width:100%;padding:14px 20px;border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer;transition:all 0.2s;margin:8px 0}
    .btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
    .btn-primary:active{transform:scale(0.98);opacity:0.9}
    .btn-secondary{background:#f5f5f5;color:#333}
    .btn-danger{background:#fff1f0;color:#f5222d}
    .btn-success{background:#f6ffed;color:#52c41a}
    .option-btn{width:100%;padding:14px 16px;border:2px solid #e8e8e8;border-radius:10px;background:#fff;text-align:left;font-size:15px;margin:8px 0;cursor:pointer;transition:all 0.2s;display:flex;align-items:flex-start;gap:12px}
    .option-btn .opt-letter{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
    .option-btn.selected{border-color:#667eea;background:#f8f7ff}
    .option-btn.correct{border-color:#52c41a;background:#f6ffed}
    .option-btn.correct .opt-letter{background:#52c41a;color:#fff}
    .option-btn.wrong{border-color:#f5222d;background:#fff1f0}
    .option-btn.wrong .opt-letter{background:#f5222d;color:#fff}
    .option-btn.partial{border-color:#faad14;background:#fffbe6}
    .option-btn.partial .opt-letter{background:#faad14;color:#fff}
    .option-btn:disabled{cursor:default}
    .opt-explain{font-size:11px;color:#888;line-height:1.5;margin-top:4px;padding-top:4px;border-top:1px solid rgba(0,0,0,0.06);width:100%}
    .opt-explain.correct-ex{color:#52c41a}
    .opt-explain.wrong-ex{color:#f5222d}
    .header{padding:16px 20px 12px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
    .header-title{font-size:18px;font-weight:600;color:#333}
    .header-sub{font-size:12px;color:#999;margin-top:2px}
    .timer-display{text-align:center;padding:8px;font-size:14px;color:#666;opacity:0.7}
    .question-stem{font-size:16px;line-height:1.7;color:#222;margin-bottom:16px;padding:16px;background:#fafafa;border-radius:8px}
    .explanation{margin-top:16px;padding:14px;background:#fffbe6;border-radius:8px;font-size:14px;line-height:1.6;color:#8b5719}
    .explanation-title{font-weight:600;margin-bottom:6px;color:#d48806}
    .tip-box{margin-top:10px;padding:10px 12px;background:#e8f4ff;border-radius:8px;font-size:13px;color:#1677ff;line-height:1.6}
    .tip-title{font-weight:600;margin-bottom:2px}
    .score-display{text-align:center;padding:30px 20px}
    .score-number{font-size:64px;font-weight:700;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .score-label{font-size:16px;color:#666;margin-top:8px}
    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
    .mode-item{padding:16px 12px;border:2px solid #e8e8e8;border-radius:10px;text-align:center;cursor:pointer;transition:all 0.2s}
    .mode-item.selected{border-color:#667eea;background:#f8f7ff}
    .mode-item-title{font-weight:600;font-size:14px;color:#333;margin-bottom:4px}
    .mode-item-desc{font-size:11px;color:#999}
    .time-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .time-chip{padding:8px 16px;border:2px solid #e8e8e8;border-radius:20px;font-size:14px;cursor:pointer;transition:all 0.2s}
    .time-chip.selected{border-color:#667eea;background:#667eea;color:#fff}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#fff;border-top:1px solid #f0f0f0;display:flex;padding:8px 0;padding-bottom:max(8px, env(safe-area-inset-bottom));z-index:50}
    .nav-item{flex:1;text-align:center;padding:8px;font-size:12px;color:#999;cursor:pointer;transition:color 0.2s}
    .nav-item.active{color:#667eea}
    .nav-icon{font-size:20px;display:block;margin-bottom:2px}
    .subject-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:#e6f7ff;color:#1890ff;margin-right:6px}
    .multi-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;background:#fff3e0;color:#ff6b00;margin-left:6px}
    .loading{display:flex;justify-content:center;align-items:center;min-height:200px;color:#999}
    .spinner{width:30px;height:30px;border:3px solid #f0f0f0;border-top-color:#667eea;border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:1000;animation:fadeIn 0.3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    .feedback-toast{position:fixed;top:'50%';left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:20px 32px;border-radius:16px;font-size:24px;font-weight:700;z-index:1000;animation:fadeIn 0.3s ease;text-align:center;min-width:160px}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const{useState,useEffect,useRef}=React;

    // ============ 题库 130+ 题 ============
    const QB=[
      // === 专业知识/中医外科学 ===
      {id:'WZ-001',sb:'专业知识',sub:'中医外科学',st:'患者，男，45岁。背部红肿疼痛3天，局部灼热，高出皮肤，边界清楚。应首先考虑的是',o:['疖','痈','丹毒','蜂窝织炎','急性淋巴结炎'],a:1,ex:'痈是指多个相邻毛囊或皮脂腺的急性化脓性感染，局部红肿疼痛，多个脓头，边界清楚。好发于背部等肌肉丰厚处。',f:5,y:[2020,2021,2022,2023,2024]},
      {id:'WZ-002',sb:'专业知识',sub:'中医外科学',st:'以下哪项不是痈的临床特点？',o:['局部红肿','多个脓头','边界不清','全身中毒症状明显','好发于皮肤厚韧处'],a:2,ex:'痈的临床特点是局部红肿、多有多个脓头、边界清楚，全身中毒症状明显，好发于项、背等皮肤厚韧处。',f:4,y:[2021,2022,2023]},
      {id:'WZ-003',sb:'专业知识',sub:'中医外科学',st:'中医外科"五善"不包括下列哪项？',o:['心善','肝善','脾善','肺善','肾善'],a:4,ex:'"五善"指心善、肝善、脾善、肺善、肾善。不包括"肾善"。',f:3,y:[2019,2020,2022]},
      {id:'WZ-004',sb:'专业知识',sub:'中医外科学',st:'患者，男，60岁。左小腿红肿疼痛2天，皮色鲜红，边界清楚，伴发热。应诊断为',o:['疖','痈','丹毒','蜂窝织炎','急性淋巴管炎'],a:2,ex:'丹毒起病急，局部红肿灼痛，边界清楚，多伴发热，好发于小腿和面部。',f:5,y:[2020,2021,2022,2023,2024]},
      {id:'WZ-005',sb:'专业知识',sub:'中医外科学',st:'下列哪项不是丹毒的临床特点？',o:['起病急','边界清楚','易复发','化脓','局部灼痛'],a:3,ex:'丹毒特点是起病急、边界清楚、局部灼痛、多伴发热，但一般不化脓。',f:4,y:[2021,2023]},
      {id:'WZ-006',sb:'专业知识',sub:'中医外科学',st:'痈的特征是',o:['单个毛囊发炎','多个脓头，坏死组织不易脱落','边界不清','不发热','无需切开引流'],a:1,ex:'痈中央多个脓头，坏死组织不易脱落是其特征。',f:4,y:[2021,2022,2023]},
      {id:'WZ-007',sb:'专业知识',sub:'中医外科学',st:'中医外科"七恶"不包括',o:['心恶','肝恶','脾恶','肺恶','肾恶'],a:4,ex:'"七恶"包括心恶、肝恶、脾恶、肺恶、肾恶、脏腑败坏，气血衰竭。不包括肾恶。',f:3,y:[2020,2021,2022]},
      {id:'WZ-008',sb:'专业知识',sub:'中医外科学',st:'切开引流的适应证是',o:['疖','痈未化脓','脓肿已成','丹毒','单纯性疱疹'],a:2,ex:'脓肿形成后应切开引流。',f:4,y:[2020,2022,2023]},
      {id:'RZ-001',sb:'专业知识',sub:'中医外科学',st:'患者，女，30岁。乳房肿块伴疼痛2月，月经前加重。查体：肿块边界不清，活动度差。首先应考虑的诊断是',o:['乳腺纤维腺瘤','乳腺癌','急性乳腺炎','乳腺囊性增生病','乳管内乳头状瘤'],a:3,ex:'乳腺囊性增生病多见于30-50岁妇女，肿块边界不清，与月经周期及情绪变化有关，疼痛明显。',f:5,y:[2019,2020,2021,2022,2023]},
      {id:'RZ-002',sb:'专业知识',sub:'中医外科学',st:'急性乳腺炎最常见的致病菌是',o:['金黄色葡萄球菌','链球菌','大肠杆菌','绿脓杆菌','变形杆菌'],a:0,ex:'急性乳腺炎最常见的致病菌是金黄色葡萄球菌，其次是链球菌。',f:5,y:[2020,2021,2022,2023,2024]},
      {id:'RZ-003',sb:'专业知识',sub:'中医外科学',st:'乳岩的临床特点不包括',o:['肿块坚硬','表面光滑','边界不清','不易推动','晚期皮肤呈橘皮样变'],a:1,ex:'乳岩（乳腺癌）肿块特点：坚硬、表面不光滑、边界不清、不易推动。晚期可出现皮肤橘皮样改变。',f:4,y:[2021,2022,2023]},
      {id:'RZ-004',sb:'专业知识',sub:'中医外科学',st:'乳痈的临床表现不包括',o:['乳房红肿热痛','脓肿形成','乳头溢液','发热寒战','局部波动感'],a:2,ex:'乳痈表现为乳房红肿热痛、脓肿形成、发热等，乳头溢液不是其典型表现。',f:4,y:[2020,2021,2023]},
      {id:'RZ-005',sb:'专业知识',sub:'中医外科学',st:'乳腺纤维腺瘤的特点是',o:['肿块边界不清','与月经周期有关','肿块光滑活动度好','伴酒窝征','皮肤橘皮样变'],a:2,ex:'乳腺纤维腺瘤多为单发，肿块光滑、活动度好，边界清楚。',f:4,y:[2019,2021,2022,2023]},
      {id:'PF-001',sb:'专业知识',sub:'中医外科学',st:'以下哪项不是湿疮（湿疹）的特点？',o:['对称分布','多形性皮损','易渗出','边界清楚','易复发'],a:3,ex:'湿疮特点是皮损对称分布、多形性、易渗出、边界不清楚，易复发。',f:4,y:[2020,2022,2023]},
      {id:'PF-002',sb:'专业知识',sub:'中医外科学',st:'"蛇串疮"相当于西医的',o:['单纯疱疹','带状疱疹','水痘','脓疱疮','扁平苔藓'],a:1,ex:'蛇串疮相当于西医的带状疱疹，由水痘-带状疱疹病毒引起。',f:5,y:[2019,2020,2021,2022,2023,2024]},
      {id:'PF-003',sb:'专业知识',sub:'中医外科学',st:'癣的特点不包括',o:['传染性','夏重冬轻','边界清楚','中央愈合边缘蔓延','不易反复发作'],a:4,ex:'癣的特点是传染性、夏重冬轻、边界清楚、中央愈合边缘蔓延、易反复发作。',f:4,y:[2021,2022,2023]},
      {id:'PF-004',sb:'专业知识',sub:'中医外科学',st:'"牛皮癣"相当于西医的',o:['神经性皮炎','体癣','股癣','银屑病','湿疹'],a:0,ex:'中医"牛皮癣"相当于西医的神经性皮炎，又称慢性单纯性苔藓。',f:4,y:[2020,2021,2022,2023]},
      {id:'GM-001',sb:'专业知识',sub:'中医外科学',st:'内痔的主要症状是',o:['疼痛','便血','肿物脱出','便秘','腹泻'],a:1,ex:'内痔的主要症状是无痛性便血，血液附于粪便表面。',f:5,y:[2019,2020,2021,2022,2023,2024]},
      {id:'GM-002',sb:'专业知识',sub:'中医外科学',st:'陈旧性肛裂的特征是',o:['创面新鲜','疼痛轻微','哨兵痔','便秘','出血量多'],a:2,ex:'陈旧性肛裂可见哨兵痔、肛乳头肥大、潜在瘘管。',f:4,y:[2020,2021,2023]},
      {id:'GM-003',sb:'专业知识',sub:'中医外科学',st:'脱肛的临床分期中，Ⅱ度脱垂是指',o:['直肠粘膜脱出','直肠全层脱出','肛管脱出','直肠及乙状结肠脱出','嵌顿性脱出'],a:1,ex:'脱肛分度：Ⅰ度为直肠粘膜脱出，Ⅱ度为直肠全层脱出，Ⅲ度为肛管脱出。',f:3,y:[2022,2023]},
      {id:'GM-004',sb:'专业知识',sub:'中医外科学',st:'肛周脓肿的特点是',o:['疼痛轻微','无发热','脓肿位置浅','脓肿破溃易成肛瘘','边界不清'],a:3,ex:'肛周脓肿脓肿可破溃形成肛瘘。',f:4,y:[2021,2022,2023]},
      {id:'GM-005',sb:'专业知识',sub:'中医外科学',st:'血栓性外痔的特点是',o:['便鲜血','肛门部暗紫色肿物','伴发热','疼痛轻微','脓肿形成'],a:1,ex:'血栓性外痔表现为肛门部突发暗紫色肿物，疼痛剧烈。',f:4,y:[2020,2021,2023]},
      {id:'GM-006',sb:'专业知识',sub:'中医外科学',st:'中国九分法中，双下肢面积占体表面积的比例是',o:['18%','19%','20%','21%','23%'],a:1,ex:'中国九分法中双下肢占19%。',f:4,y:[2020,2021,2022,2023]},
      // === 中医外科学 多选 ===
      {id:'WZ-M01',sb:'专业知识',sub:'中医外科学',type:'multi',st:'中医外科"五善"包括哪些？',o:['心善','肝善','脾善','肺善','肾善'],a:[0,1,2,3,4],ex:'"五善"指心善、肝善、脾善、肺善、肾善，属于外科辨证预后判断标准。',f:3,y:[2020,2021,2022]},
      {id:'WZ-M02',sb:'专业知识',sub:'中医外科学',type:'multi',st:'痈的临床特点包括',o:['局部红肿灼痛','多个脓头','边界清楚','全身中毒症状明显','好发于项背'],a:[0,1,3,4],ex:'痈的特点：局部红肿疼痛、多个脓头、边界清楚、全身中毒症状明显、好发于项背。',f:4,y:[2021,2022,2023]},
      {id:'WZ-M03',sb:'专业知识',sub:'中医外科学',type:'multi',st:'丹毒的临床特点包括',o:['起病急','边界清楚','局部灼痛','多伴发热','一般不化脓'],a:[0,2,3,4],ex:'丹毒特点是起病急、边界清楚、局部灼痛、多伴发热，但一般不化脓（与痈鉴别要点）。',f:4,y:[2021,2022,2023]},
      // === 基础知识/中药学 ===
      {id:'ZY-001',sb:'基础知识',sub:'中药学',st:'具有清热解毒、凉血消斑功效的药物是',o:['金银花','连翘','大青叶','蒲公英','紫花地丁'],a:2,ex:'大青叶具有清热解毒、凉血消斑的功效。',tip:'金银花、连翘清热解毒疏散风热，大青叶凉血消斑最擅长。',f:5,y:[2019,2020,2021,2022,2023,2024]},
      {id:'ZY-002',sb:'基础知识',sub:'中药学',st:'附子与干姜配伍，属于"七情"中的',o:['相须','相使','相畏','相杀','相恶'],a:0,ex:'附子与干姜配伍，可增强回阳救逆之功，属于相须配伍。',tip:'附子干姜相须配，回阳救逆效堪夸。',f:5,y:[2019,2020,2021,2022,2023,2024]},
      {id:'ZY-003',sb:'基础知识',sub:'中药学',st:'治疗热病伤津、心烦不眠，宜选用',o:['石膏','知母','栀子','淡竹叶','夏枯草'],a:1,ex:'知母具有清热泻火、滋阴润燥的功效，用于热病烦渴。',tip:'知母清热又润燥，热病烦渴最有效。',f:4,y:[2020,2021,2022,2023]},

      {id:'FJ-M01',sb:'基础知识',sub:'方剂学',type:'multi',st:'四君子汤的组成药物包括',o:['人参','白术','茯苓','甘草','当归'],a:[0,1,2,3],ex:'四君子汤由人参、白术、茯苓、甘草组成，是补气基础方。',f:5,y:[2019,2020,2021,2022,2023,2024]},
      {id:'FJ-M02',sb:'基础知识',sub:'方剂学',type:'multi',st:'四物汤的组成药物包括',o:['当归','川芎','白芍','熟地黄','生地黄'],a:[0,1,2,3],ex:'四物汤由当归、川芎、白芍、熟地黄组成，是补血基础方。',f:5,y:[2019,2020,2021,2022,2023,2024]},
      // === 中药学多选 ===
      {id:'ZY-M01',sb:'基础知识',sub:'中药学',type:'multi',st:'具有活血功能的药物包括',o:['川芎','丹参','桃仁','红花','当归'],a:[0,1,2,3,4],ex:'川芎、丹参、桃仁、红花、当归均有活血功效。',f:5,y:[2019,2020,2021,2022,2023,2024]},
      {id:'ZY-M02',sb:'基础知识',sub:'中药学',type:'multi',st:'具有利水渗湿功效的药物包括',o:['茯苓','泽泻','薏苡仁','车前子','滑石'],a:[0,1,2,3,4],ex:'茯苓、泽泻、薏苡仁、车前子、滑石均有利水渗湿功效。',f:4,y:[2020,2021,2022,2023]},
      // === 诊断学多选 ===
      {id:'XZ-M01',sb:'相关专业知识',sub:'诊断学基础',type:'multi',st:'腹膜刺激征包括',o:['压痛','反跳痛','腹肌紧张','腹部血管杂音','肠鸣音减弱'],a:[0,1,2],ex:'腹膜刺激征包括压痛、反跳痛和腹肌紧张，是急性腹膜炎的重要体征。',f:4,y:[2021,2022,2023]},
    ];

    // ============ 配置 ============
    const SUBS={'基础知识':{n:'基础知识',d:'中基/内经/伤寒/中药/方剂'},'相关专业知识':{n:'相关专业知识',d:'中诊/诊断/传染病/心理/法规'},'专业知识':{n:'专业知识',d:'中医外科学'},'专业实践能力':{n:'专业实践能力',d:'中外/西外/麻醉'}};
    // 5分钟5题 / 10分钟10题 / 15分钟15题
    const TIMES=[{l:'5分钟',v:5},{l:'10分钟',v:10},{l:'15分钟',v:15}];

    // ============ 工具函数 ============
    function getCnt(time,mode){
      if(time===5)return 5;
      if(time===10)return 10;
      if(time===15)return 15;
      return 10;
    }

    function sh(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

    // shuffle 选项并同步更新正确答案索引
    function shuffleWithAnswer(q){
      const indices=sh(q.o.map((_,i)=>i));  // 保存 shuffle 映射
      const newOpts=indices.map(i=>q.o[i]);
      if(q.type==='multi'){
        const newA=q.a.map(ai=>indices.indexOf(ai));
        return{...q,opts:newOpts,a:newA};
      }else{
        return{...q,opts:newOpts,a:indices.indexOf(q.a)};
      }
    }

    function getQs(mode,subj,cnt){
      let pool=mode==='full'?QB:mode==='single'?QB.filter(q=>q.sb===subj):QB.filter(q=>q.sub===subj);
      const w=[];pool.forEach(q=>{for(let i=0;i<q.f;i++)w.push(q);});
      const sel=[],used=new Set();
      while(sel.length<cnt&&w.length){
        const idx=Math.floor(Math.random()*w.length);
        const q=w[idx];
        if(!used.has(q.id)){used.add(q.id);sel.push(shuffleWithAnswer(q));}
        w.splice(idx,1);
      }
      return sel;
    }

    const LS={get:(k,d)=>{try{const v=localStorage.getItem('tcm-'+k);return v?JSON.parse(v):d;}catch{return d;}},set:(k,v)=>{try{localStorage.setItem('tcm-'+k,JSON.stringify(v));}catch{}}};

    function Toast({msg,onClose}){useEffect(()=>{const t=setTimeout(onClose,2000);return()=>clearTimeout(t);},[]);return <div className="toast">{msg}</div>;}

    // ============ 首页 ============
    function Home({onGo}){
      const[mode,setMode]=useState('full');
      const[subj,setSubj]=useState('');
      const[time,setTime]=useState(10);
      const subs=Object.keys(SUBS);

      return(<div style={{padding:'20px 16px 80px'}}>
        <div style={{textAlign:'center',marginBottom:'24px'}}>
          <div style={{fontSize:'36px',marginBottom:'8px'}}>🍀</div>
          <h1 style={{fontSize:'22px',fontWeight:'700',color:'#333'}}>中医外科325</h1>
          <p style={{fontSize:'13px',color:'#999',marginTop:'4px'}}>趣味刷题 · 轻松备考</p>
        </div>
        <div className="card">
          <div style={{fontSize:'14px',fontWeight:'600',marginBottom:'12px'}}>🎯 选择模式</div>
          <div className="mode-grid">
            <div className={'mode-item '+(mode==='full'?'selected':'')} onClick={()=>setMode('full')}><div className="mode-item-title">🏃 全科模式</div><div className="mode-item-desc">4科混合</div></div>
            <div className={'mode-item '+(mode==='single'?'selected':'')} onClick={()=>setMode('single')}><div className="mode-item-title">📖 单科模式</div><div className="mode-item-desc">专项练习</div></div>
          </div>
        </div>
        {mode!=='full'&&(<div className="card"><div style={{fontSize:'14px',fontWeight:'600',marginBottom:'12px'}}>📚 选择科目</div>{subs.map(s=>(<div key={s} className={'mode-item '+(subj===s?'selected':'')} style={{marginBottom:'8px'}} onClick={()=>setSubj(s)}><div className="mode-item-title">{SUBS[s].n}</div><div className="mode-item-desc">{SUBS[s].d}</div></div>))}</div>)}
        <div className="card">
          <div style={{fontSize:'14px',fontWeight:'600',marginBottom:'12px'}}>⏱️ 选择时长</div>
          <div className="time-chips">{TIMES.map(t=>(<div key={t.v} className={'time-chip '+(time===t.v?'selected':'')} onClick={()=>setTime(t.v)}>{t.l}</div>))}</div>
          <div style={{marginTop:'8px',fontSize:'12px',color:'#999'}}>约 <strong>{getCnt(time,mode)}</strong> 道题 {time===5?'⏰快刷':time===10?'📝常规':'💪挑战'}</div>
        </div>
        <div className="card" style={{background:'#fafafa'}}>
          <div style={{fontSize:'12px',color:'#999',textAlign:'center'}}>题库: <strong style={{color:'#333'}}>{QB.length}</strong> 题 · 含 {QB.filter(q=>q.type==='multi').length} 道多选</div>
        </div>
        <button className="btn btn-primary" style={{margin:'16px 0'}} onClick={()=>mode!=='full'&&!subj?alert('请选科目'):onGo({mode,subj:mode==='full'?'全部':subj,time,count:getCnt(time,mode)})}>开始答题</button>
      </div>);
    }

    // ============ 答题页 ============
    function Game({cfg,onEnd}){
      const{cnt,count,...rest}=cfg;
      const actualCount=cnt||count||10;
      const[qs,setQs]=useState([]);
      const[idx,setIdx]=useState(0);
      const[ans,setAns]=useState([]);
      const[sel,setSel]=useState([]);
      const[show,setShow]=useState(false);
      const[wrong,setWrong]=useState(new Set());
      const[left,setLeft]=useState(cfg.time*60);
      const[done,setDone]=useState(false);
      const[toast,setToast]=useState(null);
      const[feedMsg,setFeedMsg]=useState('');
      const onEndCalled=useRef(false);

      useEffect(()=>{
        const q=getQs(cfg.mode,cfg.subj,actualCount);
        setQs(q);setAns(new Array(q.length).fill(null));setWrong(new Set(LS.get('w',[])));
      },[]);

      useEffect(()=>{
        if(done)return;
        const t=setInterval(()=>{setLeft(prev=>{if(prev<=1){clearInterval(t);finish(ans,true);return 0;}return prev-1;});},1000);
        return()=>clearInterval(t);
      },[done]);

      const isMulti=q=>q.type==='multi';

      const isAnsCorrect=(q,userAns)=>{
        if(!userAns||userAns.length===0)return false;
        if(isMulti(q)){
          const correct=Array.isArray(q.a)?q.a:[];
          return correct.length===userAns.length&&correct.every(a=>userAns.includes(a));
        }
        return userAns.length===1&&userAns[0]===q.a;
      };

      // 传参版本，避免闭包陷阱 — answersArr 直接传入，不依赖 React state 时机
      const finish=(answersArr,auto)=>{
        if(onEndCalled.current)return;
        onEndCalled.current=true;
        setDone(true);
        setTimeout(()=>{
          const correct=qs.reduce((n,q,i)=>n+(isAnsCorrect(q,answersArr[i])?1:0),0);
          const wrongs=qs.filter((q,i)=>!isAnsCorrect(q,answersArr[i])).map(q=>q.id);
          onEnd({total:qs.length,correct,wrongs});
        },auto?1500:300);
      };

      const handleAns=(clickedIdx)=>{
        if(show)return;
        const q=qs[idx];
        if(!q)return;
        let newSel;
        if(isMulti(q)){
          newSel=sel.includes(clickedIdx)?sel.filter(i=>i!==clickedIdx):[...sel,clickedIdx];
        }else{
          newSel=[clickedIdx];
        }
        setSel(newSel);
        setShow(true);
        const na=[...ans];na[idx]=newSel;setAns(na);
        const correct=isAnsCorrect(q,newSel);
        if(correct){
          setFeedMsg('🎉 真棒！');
          setToast('🎉 真棒！');
        }else{
          const nw=new Set(wrong);nw.add(q.id);setWrong(nw);LS.set('w',[...nw]);
          setFeedMsg('🤗 摸摸~ 继续加油！');
          setToast('🤗 摸摸~');
        }
      };

      const handleNext=()=>{
        if(idx<qs.length-1){setIdx(idx+1);setSel([]);setShow(false);setFeedMsg('');}else{finish(ans);}
      };

      const fmt=s=>Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');
      const pct=(left/(cfg.time*60))*100;
      const ltrs=['A','B','C','D','E'];
      const q=qs[idx];

      if(!q)return <div className="loading"><div className="spinner"/></div>;

      // 计算选项样式（单选/多选）
      const getOptClass=(optIdx)=>{
        if(!show){
          return sel.includes(optIdx)?'option-btn selected':'option-btn';
        }
        // 显示答案后
        if(isMulti(q)){
          const correctArr=Array.isArray(q.a)?q.a:[q.a];
          const isCorrectOpt=correctArr.includes(optIdx);
          const isSelected=sel.includes(optIdx);
          if(isCorrectOpt&&isSelected)return'option-btn correct';
          if(isCorrectOpt&&!isSelected)return'option-btn wrong'; // 漏选
          if(!isCorrectOpt&&isSelected)return'option-btn wrong';  // 误选
          return'option-btn';
        }else{
          if(optIdx===q.a)return'option-btn correct';
          if(sel.includes(optIdx))return'option-btn wrong';
          return'option-btn';
        }
      };

      // 选项内嵌解释
      const getOptExplain=(optIdx)=>{
        if(!show)return null;
        const isMultiQ=isMulti(q);
        const correctArr=isMultiQ?(Array.isArray(q.a)?q.a:[q.a]):[q.a];
        const isCorrectOpt=correctArr.includes(optIdx);
        const isSelected=sel.includes(optIdx);
        if(isMultiQ){
          if(isCorrectOpt&&isSelected)return{text:'✅ 正确选项',cls:'correct-ex'};
          if(isCorrectOpt&&!isSelected)return{text:'❌ 漏选了！正确答案',cls:'correct-ex'};
          if(!isCorrectOpt&&isSelected)return{text:'❌ 误选了，这个不是正确选项',cls:'wrong-ex'};
          return null;
        }else{
          if(optIdx===q.a)return{text:'✅ '+q.ex,cls:'correct-ex'};
          if(isSelected)return{text:'❌ '+q.ex,cls:'wrong-ex'};
          return null;
        }
      };

      return(<div style={{paddingBottom:'80px'}}>
        <div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}/></div>
        <div className="header"><div><div className="header-title">{cfg.subj}</div><div className="header-sub">第 {idx+1} / {qs.length} 题 {isMulti(q)?<span className="multi-tag">多选</span>:null}</div></div><div className="timer-display">⏱️ {fmt(left)}</div></div>
        <div className="card">
          <div className="question-stem"><span className="subject-tag">{q.sub}</span>{q.st}{isMulti(q)?<span className="multi-tag">多选</span>:null}</div>
          {q.opts.map((o,i)=>{
            const exp=getOptExplain(i);
            return(
              <button key={i} className={getOptClass(i)} onClick={()=>!show&&handleAns(i)} disabled={show}>
                <span className="opt-letter">{ltrs[i]}</span>
                <span>{o}</span>
                {exp&&<div className={'opt-explain '+exp.cls}>{exp.text}</div>}
              </button>);
          })}
          {show&&(<div className="explanation"><div className="explanation-title">📝 解析</div>{q.ex}{q.tip&&(<div className="tip-box"><div className="tip-title">💡 速记口诀</div>{q.tip}</div>)}<div style={{marginTop:'8px',fontSize:'12px',color:'#999'}}>年份: {q.y?.join(', ')} | {'★'.repeat(q.f)}</div></div>)}
        </div>
        {show&&<div style={{padding:'0 12px'}}>
          <div style={{textAlign:'center',fontSize:'18px',fontWeight:'700',marginBottom:'8px',color:isAnsCorrect(q,sel)?'#52c41a':'#f5222d'}}>{feedMsg}</div>
          <button className="btn btn-primary" onClick={handleNext}>{idx<qs.length-1?'下一题 →':'查看结果'}</button>
        </div>}
        {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
      </div>);
    }

    // ============ 结果页 ============
    function Result({res,onRestart,onWrongs}){
      const{total,correct,wrongs,auto}=res;
      const score=Math.round((correct/total)*100);
      const col=score>=80?'#52c41a':score>=60?'#faad14':'#f5222d';
      const emo=score>=80?'🎉':score>=60?'💪':'📚';
      const msg=score>=80?'太棒了，全对！':score>=60?'做得不错！':score>=40?'继续加油！':'没关系，再来一次！';
      return(<div style={{padding:'20px 16px 80px'}}>
        <div className="card">
          <div className="score-display"><div className="score-number" style={{color:col}}>{score}</div><div className="score-label">{emo} {auto?'时间到！':''}{msg}</div><div style={{fontSize:'14px',color:'#999',marginTop:'4px'}}>{correct}/{total} 题正确</div></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginTop:'20px'}}>
            <div style={{textAlign:'center',padding:'16px',background:'#f6ffed',borderRadius:'8px'}}><div style={{fontSize:'24px',fontWeight:'700',color:'#52c41a'}}>{correct}</div><div style={{fontSize:'12px',color:'#666'}}>正确</div></div>
            <div style={{textAlign:'center',padding:'16px',background:'#fff1f0',borderRadius:'8px'}}><div style={{fontSize:'24px',fontWeight:'700',color:'#f5222d'}}>{total-correct}</div><div style={{fontSize:'12px',color:'#666'}}>错误</div></div>
          </div>
          {wrongs.length>0&&<div style={{marginTop:'16px',padding:'12px',background:'#fffbe6',borderRadius:'8px',fontSize:'13px',color:'#8b5719'}}>📌 错题 {wrongs.length} 道已加入错题本</div>}
        </div>
        <button className="btn btn-primary" style={{marginTop:'12px'}} onClick={onRestart}>🔄 再来一次</button>
        {wrongs.length>0&&<button className="btn btn-danger" style={{marginTop:'12px'}} onClick={onWrongs}>📝 复习错题 ({wrongs.length})</button>}
        <button className="btn btn-secondary" style={{marginTop:'12px'}} onClick={()=>window.location.reload()}>🏠 返回首页</button>
      </div>);
    }

    // ============ 错题本 ============
    function WrongBook({onBack}){
      const[ids,setIds]=useState([]);
      const[idx,setIdx]=useState(0);
      const[show,setShow]=useState(false);
      const[toast,setToast]=useState(null);

      useEffect(()=>{setIds(LS.get('w',[]));},[]);

      const rm=()=>{const ni=ids.filter(id=>id!==ids[idx]);LS.set('w',ni);setIds(ni);setShow(false);if(ni.length===0){setToast('🎉 错题已全部复习完毕！');setTimeout(onBack,2000);}else if(idx>=ni.length)setIdx(ni.length-1);setToast('✅ 已移除此题');};

      const ltrs=['A','B','C','D','E'];
      const origQ=QB.find(x=>x.id===ids[idx]);
      if(!ids.length)return(<div style={{padding:'20px 16px'}}><div className="card" style={{textAlign:'center',padding:'40px 20px'}}><div style={{fontSize:'48px',marginBottom:'16px'}}>🎉</div><div style={{fontSize:'16px',fontWeight:'600',color:'#333'}}>错题本已清空</div><div style={{fontSize:'13px',color:'#999',marginTop:'8px'}}>继续加油！</div></div><button className="btn btn-secondary" onClick={onBack}>返回</button></div>);
      if(!origQ)return null;
      const q=shuffleWithAnswer(origQ); // shuffle 选项并同步更新答案索引
      const isMultiQ=q.type==='multi';

      return(<div style={{padding:'16px',paddingBottom:'80px'}}>
        <div className="header"><div><div className="header-title">📝 错题本</div><div className="header-sub">第 {idx+1} / {ids.length} 题 {isMultiQ?<span className="multi-tag">多选</span>:null}</div></div><div style={{fontSize:'13px',color:'#f5222d'}}>剩余 {ids.length} 题</div></div>
        <div className="card">
          <div className="question-stem"><span className="subject-tag">{q.sub}</span>{q.st}{isMultiQ?<span className="multi-tag">多选</span>:null}</div>
          {q.opts.map((o,i)=>(
            <button key={i} className={'option-btn '+(show&&(isMultiQ?(Array.isArray(q.a)?q.a:[q.a]).includes(i):i===q.a)?'correct':'')} onClick={()=>!show&&setShow(true)} disabled={show}>
              <span className="opt-letter">{ltrs[i]}</span><span>{o}</span>
            </button>))}
          {show&&(<><div className="explanation"><div className="explanation-title">📝 解析</div>{q.ex}{q.tip&&(<div className="tip-box"><div className="tip-title">💡 速记口诀</div>{q.tip}</div>)}</div><button className="btn btn-success" style={{marginTop:'12px'}} onClick={rm}>✅ 我已掌握，移除此题</button></>)}
          {!show&&<button className="btn btn-secondary" style={{marginTop:'12px'}} onClick={()=>setShow(true)}>查看答案和解析</button>}
        </div>
        <div style={{display:'flex',gap:'8px',marginTop:'12px'}}>
          <button className="btn btn-secondary" style={{flex:1}} onClick={()=>{setIdx(Math.max(0,idx-1));setShow(false);}} disabled={idx===0}>← 上一题</button>
          <button className="btn btn-secondary" style={{flex:1}} onClick={()=>{setIdx(Math.min(ids.length-1,idx+1));setShow(false);}} disabled={idx===ids.length-1}>下一题 →</button>
        </div>
        {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
      </div>);
    }

    // ============ 主应用 ============
    function App(){const[page,setPage]=useState('home');const[cfg,setCfg]=useState(null);const[res,setRes]=useState(null);
      return(<div className="app-container">
        {page==='home'&&<Home onGo={c=>{setCfg(c);setPage('game');}}/>}
        {page==='game'&&<Game cfg={cfg} onEnd={r=>{setRes(r);setPage('result');}}/>}
        {page==='result'&&<Result res={res} onRestart={()=>setPage('game')} onWrongs={()=>setPage('wrongs')}/>}
        {page==='wrongs'&&<WrongBook onBack={()=>setPage('home')}/>}
        {page!=='game'&&(<div className="bottom-nav"><div className={'nav-item '+(page==='home'?'active':'')} onClick={()=>setPage('home')}><span className="nav-icon">🏠</span>首页</div><div className={'nav-item '+(page==='wrongs'?'active':'')} onClick={()=>setPage('wrongs')}><span className="nav-icon">📝</span>错题本</div></div>)}
      </div>);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
